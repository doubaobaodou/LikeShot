name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/LikeShot/LikeShot.csproj -c Release -v minimal

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: LikeShot-release
          path: src/LikeShot/bin/Release/net8.0-windows/LikeShot.*
          if-no-files-found: error
